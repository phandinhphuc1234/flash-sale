spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-catalog-admin
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8080}
              predicates:
                - Path=/api/v1/admin/catalog/**
            - id: product-catalog
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8080}
              predicates:
                - Path=/api/v1/catalog/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://authentication-service:8080/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none

flashsale:
  gateway:
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:false}
      environment: ${RATE_LIMIT_ENVIRONMENT:local}
      key-prefix: rl
      command-timeout: 50ms
      hmac-secret: ${RATE_LIMIT_KEY_HMAC_SECRET:}
      policies:
        public-catalog-read:
          state-version: p1
          route-id: product-catalog
          methods:
            - GET
          identity-strategy: CLIENT_IP
          capacity: 60
          refill-tokens: 30
          refill-period: 1s
          request-cost: 1
          failure-mode: ALLOW_WITH_METRIC
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles:
        gateway.rate.limit.acquire: 0.5,0.95,0.99

info:
  app:
    name: ${spring.application.name}

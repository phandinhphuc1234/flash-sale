global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      # The cloud Service exposes port 443 and forwards plain in-cluster HTTP to container port 8080.
      # TLS termination belongs to the external NLB, not to the Gateway Pod.
      - targets: [api-gateway.flash-sale.svc.cluster.local:443]
  - job_name: authentication-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [authentication-service.flash-sale.svc.cluster.local:8080]
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [product-service.flash-sale.svc.cluster.local:8080]
  - job_name: campaign-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [campaign-service.flash-sale.svc.cluster.local:8080]
  - job_name: flash-sale-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [flash-sale-service.flash-sale.svc.cluster.local:8080]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory-service.flash-sale.svc.cluster.local:8080]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service.flash-sale.svc.cluster.local:8080]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-service.flash-sale.svc.cluster.local:8080]
  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [cart-service.flash-sale.svc.cluster.local:8080]

apiVersion: v1
kind: ConfigMap
metadata:
  name: flash-sale-service-runtime-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/flashsale_db"
  SPRING_LIQUIBASE_ENABLED: "false"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_AUTO_REGISTER_SCHEMAS: "false"
  JWT_ISSUER_URI: "http://authentication-service:8080"
  JWT_JWK_SET_URI: "http://authentication-service:8080/.well-known/jwks.json"
  OAUTH_TOKEN_URI: "http://authentication-service:8080/oauth2/token"
  FLASHSALE_CLIENT_ID: "flashsale-service"
  FLASHSALE_INTERNAL_JWT_AUDIENCE: "flash-sale-internal-api"
  FLASHSALE_JWT_ISSUER: "http://authentication-service:8080"
  FLASHSALE_JWT_AUDIENCE: "flash-sale-api"
  FLASHSALE_JWT_JWK_SET_URI: "http://authentication-service:8080/.well-known/jwks.json"
  CAMPAIGN_SERVICE_URL: "http://campaign-service:8080"
  FLASHSALE_CAMPAIGN_TOPIC: "campaign.lifecycle.v1"
  FLASHSALE_CAMPAIGN_CONSUMER_GROUP: "flashsale-campaign-projection-v1"
  FLASHSALE_PURCHASE_TOPIC: "flashsale.purchase.events.v1"

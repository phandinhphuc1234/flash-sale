spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:flashsale}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: ${KAFKA_AUTO_REGISTER_SCHEMAS:false}
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: true
    listener:
      ack-mode: manual_immediate
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://authentication-service:8080}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://authentication-service:8080/.well-known/jwks.json}

springdoc:
  api-docs:
    enabled: ${INVENTORY_API_DOCS_ENABLED:${API_DOCS_ENABLED:false}}
  swagger-ui:
    enabled: ${INVENTORY_API_DOCS_ENABLED:${API_DOCS_ENABLED:false}}
    path: /swagger-ui.html

flashsale:
  inventory:
    fixture:
      # The fixture adapter is disabled for normal Deployments; the Phase 22 Job opts in explicitly.
      enabled: ${INVENTORY_FIXTURE_ENABLED:false}
      # The one-shot Job supplies these values as environment variables. Keep the short names
      # aligned with the Job manifest while binding them to the prefixed configuration properties.
      variant-id: ${INVENTORY_FIXTURE_VARIANT_ID:}
      sku-snapshot: ${INVENTORY_FIXTURE_SKU_SNAPSHOT:}
      quantity: ${INVENTORY_FIXTURE_QUANTITY:0}
      reason: ${INVENTORY_FIXTURE_REASON:}
    security:
      # Public/admin requests keep the existing flash-sale-api audience.
      jwt:
        enabled: ${INVENTORY_JWT_ENABLED:true}
        audience: ${JWT_AUDIENCE:flash-sale-api}
      # Internal Campaign allocation calls use a separate audience and scope.
      internal-jwt:
        issuer: ${JWT_ISSUER_URI:http://authentication-service:8080}
        jwk-set-uri: ${JWT_JWK_SET_URI:http://authentication-service:8080/.well-known/jwks.json}
        audience: ${INTERNAL_JWT_AUDIENCE:flash-sale-internal-api}
        subject: campaign-service
        required-scope: inventory.campaign.allocate
    regular-hold:
      # Every Feature 049 runtime surface remains disabled through the setup and migration phases.
      api-enabled: ${INVENTORY_REGULAR_HOLD_API_ENABLED:false}
      command-consumer-enabled: ${INVENTORY_REGULAR_HOLD_COMMAND_CONSUMER_ENABLED:false}
      outbox-publisher-enabled: ${INVENTORY_REGULAR_HOLD_OUTBOX_PUBLISHER_ENABLED:false}
      expiry-enabled: ${INVENTORY_REGULAR_HOLD_EXPIRY_ENABLED:false}
      ttl: ${INVENTORY_REGULAR_HOLD_TTL:5m}
      commands-topic: ${INVENTORY_REGULAR_HOLD_COMMANDS_TOPIC:flashsale.inventory.regular-hold.commands.v1}
      events-topic: ${INVENTORY_REGULAR_HOLD_EVENTS_TOPIC:flashsale.inventory.regular-hold.events.v1}
      command-consumer-group: ${INVENTORY_REGULAR_HOLD_COMMAND_CONSUMER_GROUP:inventory-regular-hold-commands-v1}
      command-dlt-topic: ${INVENTORY_REGULAR_HOLD_COMMAND_DLT_TOPIC:flashsale.inventory.regular-hold-command.dlt.v1}
      retry-delays: ${INVENTORY_REGULAR_HOLD_RETRY_DELAYS:1s,3s,10s}

server:
  port: ${SERVER_PORT:8080}

info:
  app:
    name: ${spring.application.name}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

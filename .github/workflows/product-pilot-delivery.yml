name: Product Pilot Delivery

on:
  push:
    branches:
      - develop
    paths:
      - services/product-service/**
      - services/product-service/Dockerfile
      - pom.xml
      - mvnw
      - mvnw.cmd
      - .mvn/**
      - libs/**
      - .github/workflows/product-pilot-delivery.yml
  workflow_dispatch:

concurrency:
  group: product-pilot-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  AWS_REGION: ap-southeast-2
  AWS_ROLE_TO_ASSUME: arn:aws:iam::090814040069:role/github-ci-role
  ECR_REPOSITORY: flash-sale/product-service
  IMAGE_TAG: pilot-${{ github.sha }}

jobs:
  deliver:
    name: Build, publish, and propose Product image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Product Service reactor
        run: ./mvnw --batch-mode --no-transfer-progress -pl services/product-service -am verify

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: product-pilot-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Product image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --file services/product-service/Dockerfile \
            --tag "$image" \
            .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Published immutable image for commit $GITHUB_SHA"

      - name: Prepare GitOps promotion branch
        id: promotion
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          target="infra/k8s/overlays/dev-pilot/kustomization.yaml"
          branch="automation/product-image-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          python3 - "$target" "$IMAGE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          content = path.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^(\s*newTag:\s*)\S+\s*$")
          updated, count = pattern.subn(r"\g<1>" + tag, content, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one Product newTag in {path}, found {count}")
          path.write_text(updated, encoding="utf-8", newline="")
          PY

          git diff --check
          git diff -- "$target"
          git add "$target"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The desired image tag is already current; no promotion PR is needed."
            exit 0
          fi

          git commit -m "ci(gitops): promote product image ${IMAGE_TAG}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open GitOps promotion pull request
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.branch }}
          IMAGE_URI: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$PROMOTION_BRANCH" \
            --title "ci(gitops): promote Product image ${IMAGE_TAG}" \
            --body "Automated Product pilot promotion.

          - Source commit: `${GITHUB_SHA}`
          - Image: `${IMAGE_URI}`
          - Desired-state path: `infra/k8s/overlays/dev-pilot/kustomization.yaml`
          - Argo CD will reconcile only after this PR is reviewed and merged.

          This workflow does not run kubectl and does not modify Kubernetes Secrets."

      - name: Dispatch required PR validation
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.branch }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-created PR checks may be approval-gated rather than immediately runnable.
          # Dispatching the existing CI workflow keeps the protected Maven Verify check observable.
          gh workflow run ci.yml --ref "$PROMOTION_BRANCH"

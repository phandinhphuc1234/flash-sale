spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Documentation routes are exact JSON proxies only. Gateway security denies them unless
            # API_DOCS_ENABLED=true, and no internal business route is exposed here.
            - id: openapi-authentication-service
              uri: ${AUTHENTICATION_SERVICE_URL:http://authentication-service:8080}
              predicates:
                - Path=/openapi/authentication-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-product-service
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8080}
              predicates:
                - Path=/openapi/product-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-campaign-service
              uri: ${CAMPAIGN_SERVICE_URL:http://campaign-service:8080}
              predicates:
                - Path=/openapi/campaign-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-flashsale-service
              uri: ${FLASHSALE_SERVICE_URL:http://flashsale-service:8080}
              predicates:
                - Path=/openapi/flashsale-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
              predicates:
                - Path=/openapi/inventory-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-order-service
              uri: ${ORDER_SERVICE_URL:http://order-service:8080}
              predicates:
                - Path=/openapi/order-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
              predicates:
                - Path=/openapi/payment-service
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-cart-service
              uri: ${CART_SERVICE_URL:http://cart-service:8080}
              predicates:
                - Path=/openapi/cart-service
              filters:
                - SetPath=/v3/api-docs
            - id: authentication-login
              uri: ${AUTHENTICATION_SERVICE_URL:http://authentication-service:8080}
              predicates:
                - Path=/api/v1/auth/login
                - Method=POST
            - id: authentication-refresh
              uri: ${AUTHENTICATION_SERVICE_URL:http://authentication-service:8080}
              predicates:
                - Path=/api/v1/auth/refresh
                - Method=POST
            - id: authentication-api
              uri: ${AUTHENTICATION_SERVICE_URL:http://authentication-service:8080}
              predicates:
                - Path=/api/v1/auth/**
            - id: product-catalog-admin
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8080}
              predicates:
                - Path=/api/v1/admin/catalog/**
            - id: product-catalog
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8080}
              predicates:
                - Path=/api/v1/catalog/**
            - id: inventory-admin
              uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
              predicates:
                - Path=/api/v1/admin/inventory/**
            - id: campaign-admin
              uri: ${CAMPAIGN_SERVICE_URL:http://campaign-service:8080}
              predicates:
                - Path=/api/v1/admin/campaigns/**
            - id: order-public
              uri: ${ORDER_SERVICE_URL:http://order-service:8080}
              predicates:
                - Path=/api/v1/orders/**
                - Method=GET
            - id: flash-sale-public
              uri: ${FLASHSALE_SERVICE_URL:http://flashsale-service:8080}
              predicates:
                - Path=/api/v1/flash-sales/**
            - id: payment-webhook
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
              predicates:
                - Path=/webhooks/v1/payments/stripe
                - Method=POST
              filters:
                - RequestSize=1024KB
            - id: payment-api
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
              predicates:
                - Path=/api/v1/payments/**
                - Method=GET,POST
            - id: cart-api
              uri: ${CART_SERVICE_URL:http://cart-service:8080}
              predicates:
                - Path=/api/v1/cart/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://authentication-service:8080}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://authentication-service:8080/.well-known/jwks.json}

flashsale:
  gateway:
    security:
      jwt:
        audience: ${JWT_AUDIENCE:flash-sale-api}
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:false}
      environment: ${RATE_LIMIT_ENVIRONMENT:local}
      key-prefix: rl
      command-timeout: 50ms
      hmac-secret: ${RATE_LIMIT_KEY_HMAC_SECRET:}
      policies:
        public-catalog-read:
          state-version: p1
          route-id: product-catalog
          methods:
            - GET
          identity-strategy: CLIENT_IP
          capacity: 60
          refill-tokens: 30
          refill-period: 1s
          request-cost: 1
          failure-mode: ALLOW_WITH_METRIC
          enabled: true
        auth-login:
          state-version: p1
          route-id: authentication-login
          methods:
            - POST
          identity-strategy: CLIENT_IP
          capacity: 10
          refill-tokens: 10
          refill-period: 1m
          request-cost: 1
          failure-mode: ALLOW_WITH_METRIC
          enabled: true
        auth-refresh:
          state-version: p1
          route-id: authentication-refresh
          methods:
            - POST
          identity-strategy: CLIENT_IP
          capacity: 30
          refill-tokens: 30
          refill-period: 1m
          request-cost: 1
          failure-mode: ALLOW_WITH_METRIC
          enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles:
        gateway.rate.limit.acquire: 0.5,0.95,0.99

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Authentication Service
    urls:
      - name: Authentication Service
        url: /openapi/authentication-service
      - name: Product Service
        url: /openapi/product-service
      - name: Campaign Service
        url: /openapi/campaign-service
      - name: Flash Sale Service
        url: /openapi/flashsale-service
      - name: Inventory Service
        url: /openapi/inventory-service
      - name: Order Service
        url: /openapi/order-service
      - name: Payment Service
        url: /openapi/payment-service
      - name: Cart Service
        url: /openapi/cart-service

info:
  app:
    name: ${spring.application.name}

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-order-purchase-saga
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: migration
    app.kubernetes.io/feature: purchase-saga
    app.kubernetes.io/part-of: flash-sale
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: migration
        app.kubernetes.io/feature: purchase-saga
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: order-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flash-sale-runtime-config
            - configMapRef:
                name: order-service-runtime-config
            - secretRef:
                name: order-secrets
          env:
            - name: LIQUIBASE_ENABLED
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: SPRING_MAIN_KEEP_ALIVE
              value: "false"
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
            - name: SPRING_TASK_SCHEDULING_ENABLED
              value: "false"
            - name: ORDER_ACCEPTED_PURCHASE_CONSUMER_ENABLED
              value: "false"
            - name: ORDER_OUTBOX_PUBLISHER_ENABLED
              value: "false"
            - name: ORDER_OUTBOX_ENABLED
              value: "false"
            - name: ORDER_CREATION_ENABLED
              value: "false"
            - name: ORDER_QUERY_ENABLED
              value: "false"
          args:
            - --spring.main.web-application-type=none
            - --spring.main.keep-alive=false
            - --spring.liquibase.enabled=true
            - --spring.kafka.listener.auto-startup=false
            - --spring.task.scheduling.enabled=false

apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-runtime-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
  LIQUIBASE_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_AUTO_REGISTER_SCHEMAS: "false"
  ORDER_PURCHASE_ACCEPTED_TOPIC: "flashsale.purchase.events.v1"
  ORDER_PURCHASE_ACCEPTED_CONSUMER_GROUP: "order-purchase-accepted-v1"
  ORDER_PURCHASE_ACCEPTED_DLT_TOPIC: "flashsale.order.purchase-accepted.dlt.v1"
  ORDER_EVENTS_TOPIC: "flashsale.order.events.v1"
  ORDER_PAYMENT_COMMANDS_TOPIC: "flashsale.payment.commands.v1"
  ORDER_PAYMENT_EVENTS_TOPIC: "flashsale.payment.events.v1"
  ORDER_PAYMENT_EVENTS_CONSUMER_GROUP: "order-payment-events-v1"
  ORDER_PAYMENT_EVENTS_DLT_TOPIC: "flashsale.order.payment-result.dlt.v1"
  ORDER_PURCHASE_COMMANDS_TOPIC: "flashsale.purchase.commands.v1"
  ORDER_PURCHASE_RESERVATION_RESULTS_TOPIC: "flashsale.purchase.events.v1"
  ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_GROUP: "order-purchase-reservation-results-v1"
  ORDER_PURCHASE_RESERVATION_RESULTS_DLT_TOPIC: "flashsale.order.purchase-reservation-result.dlt.v1"
  OAUTH_TOKEN_URI: "http://authentication-service:8080/oauth2/token"
  ORDER_CLIENT_ID: "order-service"
  CART_SERVICE_URL: "http://cart-service:8080"
  PRODUCT_SERVICE_URL: "http://product-service:8080"
  INVENTORY_SERVICE_URL: "http://inventory-service:8080"
  ORDER_CART_CONNECT_TIMEOUT_MS: "300"
  ORDER_CART_READ_TIMEOUT_MS: "600"
  ORDER_PRODUCT_CONNECT_TIMEOUT_MS: "300"
  ORDER_PRODUCT_READ_TIMEOUT_MS: "600"
  ORDER_INVENTORY_CONNECT_TIMEOUT_MS: "300"
  ORDER_INVENTORY_READ_TIMEOUT_MS: "800"
  ORDER_REGULAR_HOLD_COMMANDS_TOPIC: "flashsale.inventory.regular-hold.commands.v1"
  ORDER_REGULAR_HOLD_EVENTS_TOPIC: "flashsale.inventory.regular-hold.events.v1"
  ORDER_REGULAR_HOLD_EVENTS_CONSUMER_GROUP: "order-regular-hold-events-v1"
  ORDER_REGULAR_HOLD_EVENTS_DLT_TOPIC: "flashsale.order.regular-hold-result.dlt.v1"
  ORDER_CART_RECONCILIATION_COMMANDS_TOPIC: "flashsale.cart.checkout.commands.v1"
  ORDER_REGULAR_PURCHASE_INTAKE_ENABLED: "false"
  ORDER_REGULAR_PURCHASE_RECOVERY_ENABLED: "false"
  ORDER_REGULAR_HOLD_RESULT_CONSUMER_ENABLED: "false"
  ORDER_REGULAR_HOLD_COMMAND_PRODUCER_ENABLED: "false"
  ORDER_CART_RECONCILIATION_PRODUCER_ENABLED: "false"
  ORDER_REGULAR_HOLD_TTL: "5m"
  ORDER_REGULAR_PAYMENT_DEADLINE_LEAD: "30s"
  ORDER_INTERNAL_TOKEN_MAX_TTL_SECONDS: "300"
  ORDER_REGULAR_PURCHASE_RECOVERY_POLL_INTERVAL: "1s"
  ORDER_REGULAR_PURCHASE_RECOVERY_BATCH_SIZE: "100"
  ORDER_REGULAR_PURCHASE_RECOVERY_CLAIM_LEASE: "30s"
  ORDER_REGULAR_PURCHASE_RECOVERY_RETRY_BACKOFF: "1s,3s,10s,30s"
  ORDER_JWT_ISSUER: "http://authentication-service:8080"
  ORDER_JWT_JWK_SET_URI: "http://authentication-service:8080/.well-known/jwks.json"
  ORDER_JWT_AUDIENCE: "flash-sale-api"
  ORDER_JWT_TYPE: "at+jwt"
  # T072 recovery completed with durable state and consumer lag rechecked. New PurchaseAccepted
  # intake is restored; Payment and reservation-result consumers plus the outbox publisher remain enabled.
  ORDER_ACCEPTED_PURCHASE_CONSUMER_ENABLED: "true"
  ORDER_PAYMENT_EVENTS_CONSUMER_ENABLED: "true"
  ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_ENABLED: "true"
  ORDER_OUTBOX_PUBLISHER_ENABLED: "true"
  ORDER_OUTBOX_ENABLED: "true"
  ORDER_CREATION_ENABLED: "true"
  ORDER_QUERY_ENABLED: "true"

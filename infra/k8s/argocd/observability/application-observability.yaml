apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flash-sale-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: flash-sale
    app.kubernetes.io/component: observability
    flash-sale.environment: cloud
spec:
  project: default
  source:
    repoURL: https://github.com/phandinhphuc1234/flash-sale.git
    targetRevision: develop
    path: infra/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-authentication-service
  labels:
    app.kubernetes.io/name: authentication-service
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: flash-sale
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentication-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: migration
          image: authentication-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flash-sale-runtime-config
            - configMapRef:
                name: authentication-service-runtime-config
            - secretRef:
                name: authentication-secrets
          env:
            - name: LIQUIBASE_ENABLED
              value: "true"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: SPRING_MAIN_KEEP_ALIVE
              value: "false"
            - name: SPRING_TASK_SCHEDULING_ENABLED
              value: "false"
          args:
            - --spring.main.web-application-type=none
            - --spring.main.keep-alive=false
            - --spring.liquibase.enabled=true
          volumeMounts:
            - name: auth-jwt
              mountPath: /run/secrets/auth-jwt
              readOnly: true
      volumes:
        - name: auth-jwt
          secret:
            secretName: auth-jwt
            defaultMode: 0440

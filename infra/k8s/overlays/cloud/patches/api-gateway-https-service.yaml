apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    # Phase 24: terminate TLS at the development-only AWS NLB and forward HTTP to Gateway:8080.
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:ap-southeast-2:090814040069:certificate/67162c57-7840-4452-bf6c-fdf42fe7be12
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /actuator/health/readiness
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
spec:
  $patch: replace
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: https
      port: 443
      targetPort: http


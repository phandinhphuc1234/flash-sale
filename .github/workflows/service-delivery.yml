name: Eight-Service GitOps Delivery

on:
  push:
    branches:
      - develop
    paths:
      - services/api-gateway/**
      - services/authentication-service/**
      - services/campaign-service/**
      - services/flashsale-service/**
      - services/inventory-service/**
      - services/order-service/**
      - services/payment-service/**
      - services/product-service/**
      - pom.xml
      - mvnw
      - mvnw.cmd
      - .mvn/**
      - libs/**
      - contracts/**
      - .github/workflows/service-delivery.yml
  workflow_dispatch:
    inputs:
      service:
        description: Select one deployed service or all eight services
        required: true
        type: choice
        default: all
        options:
          - all
          - api-gateway
          - authentication-service
          - product-service
          - campaign-service
          - flash-sale-service
          - inventory-service
          - order-service
          - payment-service

permissions:
  contents: read

concurrency:
  group: service-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  AWS_REGION: ap-southeast-2
  AWS_ROLE_TO_ASSUME: arn:aws:iam::090814040069:role/github-ci-role
  IMAGE_TAG: release-${{ github.sha }}

jobs:
  detect_targets:
    name: Detect delivery targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
      has_targets: ${{ steps.detect.outputs.has_targets }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected deployed services
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SERVICE: ${{ inputs.service }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          target_names=(
            "api-gateway"
            "authentication-service"
            "product-service"
            "campaign-service"
            "flash-sale-service"
            "inventory-service"
            "order-service"
            "payment-service"
          )

          declare -A affected=()
          select_all=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${MANUAL_SERVICE:-all}" == "all" ]]; then
              select_all=true
            else
              affected["$MANUAL_SERVICE"]=1
            fi
          else
            head_sha="$PUSH_HEAD_SHA"
            if [[ -z "${PUSH_BEFORE_SHA:-}" || "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            else
              base_sha="$PUSH_BEFORE_SHA"
            fi

            mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
            echo "Comparing $base_sha..$head_sha"
            printf 'Changed files:\n'
            printf ' - %s\n' "${changed_files[@]}"

            for file in "${changed_files[@]}"; do
              case "$file" in
                pom.xml|mvnw|mvnw.cmd|.mvn/**|libs/**|contracts/**|.github/workflows/service-delivery.yml)
                  select_all=true
                  ;;
                services/api-gateway/**) affected[api-gateway]=1 ;;
                services/authentication-service/**) affected[authentication-service]=1 ;;
                services/product-service/**) affected[product-service]=1 ;;
                services/campaign-service/**) affected[campaign-service]=1 ;;
                services/flashsale-service/**) affected[flash-sale-service]=1 ;;
                services/inventory-service/**) affected[inventory-service]=1 ;;
                services/order-service/**) affected[order-service]=1 ;;
                services/payment-service/**) affected[payment-service]=1 ;;
              esac
            done
          fi

          selected_names=()
          if [[ "$select_all" == true ]]; then
            selected_names=("${target_names[@]}")
          else
            for target in "${target_names[@]}"; do
              if [[ -n "${affected[$target]:-}" ]]; then
                selected_names+=("$target")
              fi
            done
          fi

          if ((${#selected_names[@]} == 0)); then
            echo 'targets=[]' >> "$GITHUB_OUTPUT"
            echo 'has_targets=false' >> "$GITHUB_OUTPUT"
            echo 'No deployed service image requires delivery.'
            exit 0
          fi

          selected_json="$(printf '%s\n' "${selected_names[@]}" | jq -Rsc '
            split("\n") | map(select(length > 0)) as $names |
            [
              {name:"api-gateway", module:"services/api-gateway", repository:"flash-sale/api-gateway"},
              {name:"authentication-service", module:"services/authentication-service", repository:"flash-sale/authentication-service"},
              {name:"product-service", module:"services/product-service", repository:"flash-sale/product-service"},
              {name:"campaign-service", module:"services/campaign-service", repository:"flash-sale/campaign-service"},
              {name:"flash-sale-service", module:"services/flashsale-service", repository:"flash-sale/flash-sale-service"},
              {name:"inventory-service", module:"services/inventory-service", repository:"flash-sale/inventory-service"},
              {name:"order-service", module:"services/order-service", repository:"flash-sale/order-service"},
              {name:"payment-service", module:"services/payment-service", repository:"flash-sale/payment-service"}
            ] | map(select(.name as $name | $names | index($name)))')"

          echo "Selected delivery targets: $selected_json"
          echo "targets=$selected_json" >> "$GITHUB_OUTPUT"
          echo 'has_targets=true' >> "$GITHUB_OUTPUT"

  verify_and_publish:
    name: Verify and publish ${{ matrix.target.name }}
    needs: detect_targets
    if: needs.detect_targets.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect_targets.outputs.targets) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress -pl "${{ matrix.target.module }}" -am verify

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: service-delivery-${{ matrix.target.name }}-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.target.repository }}
          SERVICE_MODULE: ${{ matrix.target.module }}
          SERVICE_NAME: ${{ matrix.target.name }}
        shell: bash
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building $SERVICE_NAME from $SERVICE_MODULE"
          docker build --file "$SERVICE_MODULE/Dockerfile" --tag "$image" .
          docker push "$image"
          echo "Published immutable image for $SERVICE_NAME at commit $GITHUB_SHA"

  promote_cloud:
    name: Propose cloud image promotion
    needs:
      - detect_targets
      - verify_and_publish
    if: needs.detect_targets.outputs.has_targets == 'true' && needs.verify_and_publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop desired state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Update selected cloud image tags
        id: promotion
        env:
          SELECTED_TARGETS: ${{ needs.detect_targets.outputs.targets }}
          PROMOTION_FILE: infra/k8s/overlays/cloud/kustomization.yaml
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/cloud-image-promotion-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          python3 - "$PROMOTION_FILE" "$SELECTED_TARGETS" "$IMAGE_TAG" <<'PY'
          import json
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          targets = json.loads(sys.argv[2])
          tag = sys.argv[3]
          content = path.read_text(encoding="utf-8")

          for target in targets:
              name = target["name"]
              pattern = re.compile(
                  rf"(?ms)(^  - name: {re.escape(name)}\r?\n)(.*?)(^    newTag:\s*)(\S+)"
              )
              updated, count = pattern.subn(rf"\g<1>\g<2>\g<3>{tag}", content, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one cloud image entry for {name}, found {count}"
                  )
              content = updated

          path.write_text(content, encoding="utf-8", newline="")
          PY

          git diff --check
          changed_files="$(git diff --name-only)"
          if [[ "$changed_files" != "$PROMOTION_FILE" ]]; then
            echo "Unexpected promotion diff: $changed_files"
            exit 1
          fi
          git diff -- "$PROMOTION_FILE"
          git add "$PROMOTION_FILE"

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Desired image tags are already current; no promotion PR is needed.'
            exit 0
          fi

          git commit -m "ci(gitops): promote cloud images ${IMAGE_TAG}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open cloud promotion pull request
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.branch }}
          SELECTED_TARGETS: ${{ needs.detect_targets.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$PROMOTION_BRANCH" \
            --title "ci(gitops): promote cloud images ${IMAGE_TAG}" \
            --body "Automated eight-service cloud image promotion.

          - Source commit: `${GITHUB_SHA}`
          - Selected targets: `${SELECTED_TARGETS}`
          - Image tag: `${IMAGE_TAG}`
          - Desired-state path: `infra/k8s/overlays/cloud/kustomization.yaml`
          - Argo CD Application: `flash-sale-cloud`

          Argo CD reconciles only after this PR is reviewed and merged. This workflow does not run kubectl or modify Kubernetes Secrets."

      - name: Dispatch required PR validation
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.branch }}
        shell: bash
        run: gh workflow run ci.yml --ref "$PROMOTION_BRANCH"

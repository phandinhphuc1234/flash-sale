spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:flashsale}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Keep readiness responsive while PostgreSQL is restarting; values remain overridable in
      # deployments that require a different connection acquisition policy.
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: ${KAFKA_AUTO_REGISTER_SCHEMAS:false}
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: true
    listener:
      ack-mode: manual_immediate
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
  security:
    oauth2:
      client:
        provider:
          authentication:
            token-uri: ${OAUTH_TOKEN_URI:http://authentication-service:8080/oauth2/token}
        registration:
          order-internal:
            provider: authentication
            client-id: ${ORDER_CLIENT_ID:order-service}
            client-secret: ${ORDER_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope:
              - cart.checkout-snapshot.read
              - catalog.purchase-quote.read
              - inventory.regular-hold.write
  cloud:
    openfeign:
      client:
        config:
          order-cart:
            connectTimeout: ${ORDER_CART_CONNECT_TIMEOUT_MS:300}
            readTimeout: ${ORDER_CART_READ_TIMEOUT_MS:600}
            loggerLevel: basic
          order-product:
            connectTimeout: ${ORDER_PRODUCT_CONNECT_TIMEOUT_MS:300}
            readTimeout: ${ORDER_PRODUCT_READ_TIMEOUT_MS:600}
            loggerLevel: basic
          order-inventory:
            connectTimeout: ${ORDER_INVENTORY_CONNECT_TIMEOUT_MS:300}
            readTimeout: ${ORDER_INVENTORY_READ_TIMEOUT_MS:800}
            loggerLevel: basic

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - orderReadiness
      validate-group-membership: false
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: w3c

info:
  app:
    name: ${spring.application.name}

order:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    accepted-purchase-topic: ${ORDER_PURCHASE_ACCEPTED_TOPIC:flashsale.purchase.events.v1}
    accepted-purchase-consumer-group: ${ORDER_PURCHASE_ACCEPTED_CONSUMER_GROUP:order-purchase-accepted-v1}
    accepted-purchase-dlt-topic: ${ORDER_PURCHASE_ACCEPTED_DLT_TOPIC:flashsale.order.purchase-accepted.dlt.v1}
    order-events-topic: ${ORDER_EVENTS_TOPIC:flashsale.order.events.v1}
    payment-commands-topic: ${ORDER_PAYMENT_COMMANDS_TOPIC:flashsale.payment.commands.v1}
    payment-events-topic: ${ORDER_PAYMENT_EVENTS_TOPIC:flashsale.payment.events.v1}
    payment-events-consumer-group: ${ORDER_PAYMENT_EVENTS_CONSUMER_GROUP:order-payment-events-v1}
    payment-events-dlt-topic: ${ORDER_PAYMENT_EVENTS_DLT_TOPIC:flashsale.order.payment-result.dlt.v1}
    purchase-commands-topic: ${ORDER_PURCHASE_COMMANDS_TOPIC:flashsale.purchase.commands.v1}
    purchase-reservation-results-topic: ${ORDER_PURCHASE_RESERVATION_RESULTS_TOPIC:flashsale.purchase.events.v1}
    purchase-reservation-results-consumer-group: ${ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_GROUP:order-purchase-reservation-results-v1}
    purchase-reservation-results-dlt-topic: ${ORDER_PURCHASE_RESERVATION_RESULTS_DLT_TOPIC:flashsale.order.purchase-reservation-result.dlt.v1}
    regular-hold-commands-topic: ${ORDER_REGULAR_HOLD_COMMANDS_TOPIC:flashsale.inventory.regular-hold.commands.v1}
    regular-hold-events-topic: ${ORDER_REGULAR_HOLD_EVENTS_TOPIC:flashsale.inventory.regular-hold.events.v1}
    regular-hold-events-consumer-group: ${ORDER_REGULAR_HOLD_EVENTS_CONSUMER_GROUP:order-regular-hold-events-v1}
    regular-hold-events-dlt-topic: ${ORDER_REGULAR_HOLD_EVENTS_DLT_TOPIC:flashsale.order.regular-hold-result.dlt.v1}
    cart-reconciliation-commands-topic: ${ORDER_CART_RECONCILIATION_COMMANDS_TOPIC:flashsale.cart.checkout.commands.v1}
    retry-delays: ${ORDER_KAFKA_RETRY_DELAYS:1s,3s,10s}
  outbox:
    enabled: ${ORDER_OUTBOX_ENABLED:true}
    poll-interval: ${ORDER_OUTBOX_POLL_INTERVAL:500ms}
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:100}
    claim-lease: ${ORDER_OUTBOX_CLAIM_LEASE:30s}
    retry-backoff-cap: ${ORDER_OUTBOX_RETRY_BACKOFF_CAP:60s}
  jwt:
    issuer: ${ORDER_JWT_ISSUER:http://authentication-service:8080}
    jwk-set-uri: ${ORDER_JWT_JWK_SET_URI:http://authentication-service:8080/.well-known/jwks.json}
    audience: ${ORDER_JWT_AUDIENCE:flash-sale-api}
    type: ${ORDER_JWT_TYPE:at+jwt}
  runtime:
    accepted-purchase-consumer-enabled: ${ORDER_ACCEPTED_PURCHASE_CONSUMER_ENABLED:true}
    purchase-reservation-results-consumer-enabled: ${ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_ENABLED:true}
    payment-events-consumer-enabled: ${ORDER_PAYMENT_EVENTS_CONSUMER_ENABLED:true}
    outbox-publisher-enabled: ${ORDER_OUTBOX_PUBLISHER_ENABLED:true}
    query-page-size-max: ${ORDER_QUERY_PAGE_SIZE_MAX:100}
  creation:
    enabled: ${ORDER_CREATION_ENABLED:true}
  query:
    enabled: ${ORDER_QUERY_ENABLED:true}
  regular-purchase:
    runtime:
      # Setup is intentionally inert; later reviewed phases enable consumers before producers/intake.
      intake-enabled: ${ORDER_REGULAR_PURCHASE_INTAKE_ENABLED:false}
      recovery-enabled: ${ORDER_REGULAR_PURCHASE_RECOVERY_ENABLED:false}
      hold-result-consumer-enabled: ${ORDER_REGULAR_HOLD_RESULT_CONSUMER_ENABLED:false}
      hold-command-producer-enabled: ${ORDER_REGULAR_HOLD_COMMAND_PRODUCER_ENABLED:false}
      cart-reconciliation-producer-enabled: ${ORDER_CART_RECONCILIATION_PRODUCER_ENABLED:false}
    hold-policy:
      ttl: ${ORDER_REGULAR_HOLD_TTL:5m}
      payment-deadline-lead: ${ORDER_REGULAR_PAYMENT_DEADLINE_LEAD:30s}
    internal-clients:
      registration-id: order-internal
      token-max-ttl-seconds: ${ORDER_INTERNAL_TOKEN_MAX_TTL_SECONDS:300}
      cart-base-url: ${CART_SERVICE_URL:http://cart-service:8080}
      product-base-url: ${PRODUCT_SERVICE_URL:http://product-service:8080}
      inventory-base-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
    recovery:
      poll-interval: ${ORDER_REGULAR_PURCHASE_RECOVERY_POLL_INTERVAL:1s}
      batch-size: ${ORDER_REGULAR_PURCHASE_RECOVERY_BATCH_SIZE:100}
      claim-lease: ${ORDER_REGULAR_PURCHASE_RECOVERY_CLAIM_LEASE:30s}
      retry-backoff: ${ORDER_REGULAR_PURCHASE_RECOVERY_RETRY_BACKOFF:1s,3s,10s,30s}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

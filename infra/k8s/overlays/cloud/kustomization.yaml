apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flash-sale

resources:
  - ../../base
  - flash-sale-config.yaml
  - config
  - platform

patches:
  - path: patches/api-gateway-https-service.yaml
    target:
      version: v1
      kind: Service
      name: api-gateway
  - path: patches/api-gateway-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
  - path: patches/authentication-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: authentication-service
  - path: patches/product-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: product-service
  - path: patches/campaign-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: campaign-service
  - path: patches/flash-sale-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: flash-sale-service
  - path: patches/inventory-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: inventory-service
  - path: patches/order-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: order-service
  - path: patches/payment-service-envfrom.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service

# Phase 13 intentionally keeps the existing bootstrap tag. Later image-promotion
# workflows will update only this overlay with immutable ECR tags.
images:
  - name: api-gateway
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/api-gateway
    newTag: release-f5a11de7dd40da24bb4c12e70fb2051b589fc066
  - name: authentication-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/authentication-service
    newTag: release-a53a4e024dd965742f96eb13ac4c964b33d03071
  - name: campaign-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/campaign-service
    newTag: release-f5a11de7dd40da24bb4c12e70fb2051b589fc066
  - name: flash-sale-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/flash-sale-service
    newTag: release-d6b57db6ee93206ebf86efdcfc62ec177389002c
  - name: inventory-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/inventory-service
    newTag: release-f5a11de7dd40da24bb4c12e70fb2051b589fc066
  - name: order-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/order-service
    newTag: release-f5a11de7dd40da24bb4c12e70fb2051b589fc066
  - name: payment-service
    newName: 090814040069.dkr.ecr.ap-southeast-2.amazonaws.com/flash-sale/payment-service
    newTag: release-f5a11de7dd40da24bb4c12e70fb2051b589fc066
  - name: product-service

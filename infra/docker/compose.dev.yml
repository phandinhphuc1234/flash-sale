services:
  authentication-service:
    ports:
      - "${AUTHENTICATION_SERVICE_PORT:-18081}:8080"

  product-service:
    ports:
      - "${PRODUCT_SERVICE_PORT:-18082}:8080"

  # Campaign's one-off Liquibase migration uses the baseline service definition; this overlay
  # only adds a direct debug port for local development.
  campaign-service:
    ports:
      - "${CAMPAIGN_SERVICE_PORT:-18083}:8080"

  flashsale-service:
    # The normal runtime keeps Liquibase disabled; use the migrations profile in compose.yml
    # for the one-off Flash Sale schema process.
    ports:
      - "${FLASHSALE_SERVICE_PORT:-18084}:8080"
    environment:
      # Keep Feature 044 local behavior explicit while allowing ignored .env overrides.
      FLASHSALE_RESERVATION_COMMANDS_ENABLED: ${FLASHSALE_RESERVATION_COMMANDS_ENABLED:-true}
      FLASHSALE_RUNTIME_RECONCILIATION_ENABLED: ${FLASHSALE_RUNTIME_RECONCILIATION_ENABLED:-true}

  order-service:
    ports:
      - "${ORDER_SERVICE_PORT:-18085}:8080"
    environment:
      ORDER_PAYMENT_EVENTS_CONSUMER_ENABLED: ${ORDER_PAYMENT_EVENTS_CONSUMER_ENABLED:-true}
      ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_ENABLED: ${ORDER_PURCHASE_RESERVATION_RESULTS_CONSUMER_ENABLED:-true}

  payment-service:
    ports:
      - "${PAYMENT_SERVICE_PORT:-18086}:8080"

  notification-service:
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-18087}:8080"

  inventory-service:
    ports:
      - "${INVENTORY_SERVICE_PORT:-18088}:8080"

  cart-service:
    ports:
      - "${CART_SERVICE_PORT:-18089}:8080"

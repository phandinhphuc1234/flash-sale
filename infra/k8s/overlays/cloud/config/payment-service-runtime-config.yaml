apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-runtime-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
  LIQUIBASE_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_AUTO_REGISTER_SCHEMAS: "false"
  PAYMENT_PROVIDER: "STRIPE"
  # Phase 20 Kafka/Schema Registry provisioning completed and was verified;
  # restore the approved Stripe test-mode runtime after this reviewed change.
  PAYMENT_ACCEPTANCE_ENABLED: "true"
  PAYMENT_CHECKOUT_ENABLED: "true"
  STRIPE_ENABLED: "true"
  STRIPE_MODE: "test"
  STRIPE_API_BASE_URL: "https://api.stripe.com"
  PAYMENT_JWT_ISSUER: "http://authentication-service:8080"
  PAYMENT_JWT_JWK_SET_URI: "http://authentication-service:8080/.well-known/jwks.json"
  PAYMENT_JWT_AUDIENCE: "flash-sale-api"
  PAYMENT_JWT_TYPE: "at+jwt"
  PAYMENT_WEBHOOK_PROCESSING_ENABLED: "true"
  PAYMENT_REQUESTED_TOPIC: "flashsale.payment.commands.v1"
  PAYMENT_EVENTS_TOPIC: "flashsale.payment.events.v1"
  PAYMENT_REQUESTED_DLT_TOPIC: "flashsale.payment.payment-requested.dlt.v1"
  PAYMENT_CONSUMER_GROUP: "payment-service-v1"
  PAYMENT_CONSUMER_ENABLED: "true"
  PAYMENT_OUTBOX_PUBLISHER_ENABLED: "true"
  PAYMENT_RECOVERY_ENABLED: "true"
